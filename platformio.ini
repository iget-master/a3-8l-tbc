[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; Gravação OTA: pio run -e esp32dev_ota -t upload --upload-port <IP-do-ESP32>
; --auth é a senha do AP (apPass) vigente no boot; se trocou pela web, ajuste aqui.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags = --auth=a3tbc123
